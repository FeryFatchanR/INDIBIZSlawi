name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        db: [sqlite, mysql]
        exclude:
          - php: '8.4'
            db: mysql
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: isp_test
          MYSQL_USER: isp
          MYSQL_PASSWORD: isp-test-pass
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite, pdo_mysql, zip, xml, curl, fileinfo, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build assets
        run: npm ci && npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        if: matrix.db == 'sqlite' && matrix.php == '8.3'
        run: vendor/bin/pint --test

      - name: Migrate up/down/up (MySQL)
        if: matrix.db == 'mysql'
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: isp_test
          DB_USERNAME: isp
          DB_PASSWORD: isp-test-pass
        run: |
          php artisan migrate --seed --force
          php artisan migrate:rollback --force
          php artisan migrate --force

      - name: Run tests (SQLite)
        if: matrix.db == 'sqlite'
        run: php artisan test

      - name: Run tests (MySQL)
        if: matrix.db == 'mysql'
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: isp_test
          DB_USERNAME: isp
          DB_PASSWORD: isp-test-pass
        run: php artisan test
